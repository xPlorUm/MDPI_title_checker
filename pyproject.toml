[tool.poetry]
name = "mdpi-title-checker"
version = "0.1.0"
description = "This project uses a pretrained model to find the closest title towards a reference title."
authors = ["Cedric Tschechtelin <cedric.tschechtelin@gmx.ch>"]
readme = "README.md"
packages = [{include = "MDPI_title_checker", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = {extras = ["standard"], version = "^0.136.0"}
uvicorn = "^0.45.0"
transformers = ">=4.36,<4.52"
torch = "^2.11.0"
nltk = "^3.9.4"
pytest = "^9.0.3"
requests = "^2.33.1"
adapters = "^1.0.0"
huggingface-hub = ">=0.23.0,<0.25.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"